<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Assistant</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e3e6eb;--ac:#2b6cb0;--ok:#2f855a;--cur:#fff4d6;--curbd:#e0a800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--tx:#e8eaed;--mu:#98a2b3;--bd:#2c323b;--ac:#63a4e8;--ok:#5fcf93;--cur:#3a3216;--curbd:#d6a800;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2128;--tx:#e8eaed;--mu:#98a2b3;--bd:#2c323b;--ac:#63a4e8;--ok:#5fcf93;--cur:#3a3216;--curbd:#d6a800;color-scheme:dark}
*{box-sizing:inherit}html{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:18px;margin:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.rec{background:#c53030;border-color:#c53030;color:#fff}
main{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 18px;max-width:1100px;margin:0 auto}
@media(max-width:760px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:0 0 10px}
#next{grid-column:1/-1;border:2px solid var(--curbd);background:var(--cur)}
#next .big{font-size:20px;font-weight:600}
#next .hint{color:var(--mu);margin-top:4px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
li .n{min-width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mu);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mu)}
li.done{opacity:.6}li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}li.done .t{text-decoration:line-through}
li.cur{background:var(--cur);border-color:var(--curbd)}
textarea{width:100%;min-height:90px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);resize:vertical}
#tr{height:300px;overflow-y:auto;white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
#tr .i{color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Call Assistant</h1>
  <div class="bar">
    <select id="lang" aria-label="Call language"><option value="en-US">English</option><option value="ar-EG">العربية (مصر)</option></select>
    <button id="go" class="pri">Start listening</button>
    <button id="chk">Check next step</button>
  </div>
</header>
<main>
  <section id="next"><h2>Next step</h2><div class="big" id="nx">Load your checklist, then start listening.</div><div class="hint" id="hint"></div></section>
  <section>
    <h2>Call checklist</h2>
    <ol id="steps"></ol>
    <div id="load">
      <textarea id="paste" placeholder="Paste your checklist here, one step per line…"></textarea>
      <div class="row"><button id="use">Use pasted steps</button><button id="up">Upload .txt / .csv / .md</button><input id="file" type="file" accept=".txt,.csv,.md,text/plain" hidden></div>
    </div>
    <div class="row"><button id="clr">Reset ticks</button><button id="chg">Change checklist</button></div>
  </section>
  <section>
    <h2>Live transcript</h2>
    <div id="tr"></div>
    <div class="row"><button id="dl">Save transcript</button><button id="cl">Clear</button></div>
    <p class="mu" id="msg"></p>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
let steps=[],done=new Set(),cur=-1,tx="",interim="",rec=null,on=false,sample=null,last=0,busy=false;
const msg=t=>$("#msg").textContent=t||"";
const parse=t=>t.split(/\r?\n/).map(l=>l.replace(/^\s*(?:[-*•]|\d+[.)])\s*/,"").replace(/^"|"$/g,"").trim()).filter(Boolean);
function drawSteps(){
  const ol=$("#steps");ol.innerHTML="";
  steps.forEach((s,i)=>{
    const li=document.createElement("li");li.className=(done.has(i)?"done ":"")+(i===cur?"cur":"");
    const n=document.createElement("span");n.className="n";n.textContent=done.has(i)?"✓":i+1;
    const t=document.createElement("span");t.className="t";t.textContent=s;
    li.append(n,t);li.onclick=()=>{done.has(i)?done.delete(i):done.add(i);if(cur===i)cur=-1;drawSteps();drawNext()};
    ol.append(li);
  });
  $("#load").style.display=steps.length?"none":"block";
}
function drawNext(h){
  if(!steps.length){$("#nx").textContent="Load your checklist, then start listening.";return}
  if(done.size>=steps.length){$("#nx").textContent="All steps complete ✓";$("#hint").textContent="";return}
  if(cur<0||done.has(cur)){cur=steps.findIndex((_,i)=>!done.has(i))}
  $("#nx").textContent=`Step ${cur+1}: ${steps[cur]}`;
  if(h!==undefined)$("#hint").textContent=h;
}
function drawT(){
  const el=$("#tr");el.textContent=tx;
  if(interim){const s=document.createElement("span");s.className="i";s.textContent=interim;el.append(s)}
  el.scrollTop=el.scrollHeight;
}
function setSteps(list){steps=list;done=new Set();cur=-1;drawSteps();drawNext("")}
$("#use").onclick=()=>{const l=parse($("#paste").value);if(l.length)setSteps(l)};
$("#up").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const l=parse(String(r.result));if(l.length)setSteps(l);else msg("No steps found in that file.")};r.readAsText(f)};
$("#clr").onclick=()=>{if(!steps.length){return}done=new Set();cur=-1;drawSteps();drawNext("")};
$("#chg").onclick=()=>{steps=[];done=new Set();cur=-1;drawSteps();drawNext("")};
$("#cl").onclick=()=>{since=0;tx="";interim="";last=0;drawT()};
$("#dl").onclick=()=>{const u=URL.createObjectURL(new Blob([tx],{type:"text/plain"}));const l=document.createElement("a");l.href=u;l.download="call-transcript.txt";l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function ui(){const b=$("#go");b.textContent=on?"Stop listening":"Start listening";b.className=on?"rec":"pri"}
$("#go").onclick=async()=>{
  if(on){on=false;try{rec.stop()}catch(e){}ui();return}
  if(!SR){msg("This browser can’t do live speech recognition. Please use Chrome or Edge.");return}
  msg("");
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang=$("#lang").value;
  rec.onresult=e=>{let p="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)tx+=r[0].transcript.trim()+"\n";else p+=r[0].transcript}interim=p;drawT()};
  rec.onend=()=>{if(on){try{rec.start()}catch(e){}}};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){on=false;ui();msg("Microphone access is blocked. Allow it in your browser’s site settings and try again.")}};
  try{rec.start();on=true;ui()}catch(e){msg("Couldn’t start the microphone.")}
};
const KEYS=[
/identif|speaking with|your name|full name|who am i/,
/verify|verif|date of birth|last four|address|confirm your|social/,
/debts?|creditor|credit card|balance|owe|accounts?/,
/are you aware|interest|charged|red pill/,
/calculat|total debt|total payments|crunch/,
/\bhold\b|underwrit|5 minutes|five minutes|one moment|bear with me/,
/loan|consolidat/,
/t[- ]?chart|program|months|monthly payment/,
/text|trust|link/,
/enroll|enrol|sign up|get started|move forward/,
/budget|income|expenses|rent|groceries/,
/hardship|reason|lost (my |your )?job|medical|struggl/,
/bank|checking|savings|banking with/,
/299|two ninety|pitch|package|fee/,
/approval|submit|send (the |your )?file/,
/sign|docusign|\bdc\b|document/,
/compliance|\brep\b/,
/compliance|on the line|connect/,
/review|referral|refer|trustpilot|feedback/
];
const STOP=new Set("about their there which would these those client current currently depending state skip file".split(" "));
let since=0;
function keyFor(i){
  if(steps.length===DEFAULT_STEPS.length&&steps.every((x,k)=>x===DEFAULT_STEPS[k]))return KEYS[i];
  const w=(steps[i].toLowerCase().match(/[a-z]{5,}/g)||[]).filter(x=>!STOP.has(x));
  return w.length?new RegExp(w.join("|")):null;
}
function detect(force){
  if(!steps.length)return;
  const t=tx.slice(since).toLowerCase();if(!t.trim())return;
  const c=steps.findIndex((_,i)=>!done.has(i));if(c<0)return;
  for(let i=c;i<Math.min(c+3,steps.length);i++){
    const k=keyFor(i);
    if(k&&k.test(t)){done.add(i);since=tx.length;cur=-1;drawSteps();drawNext("Heard it. Tap any step to correct me.");return}
  }
  if(force)msg("Nothing new matched yet.");
}
$("#chk").onclick=()=>detect(true);
setInterval(()=>{if(on)detect(false)},2500);
const DEFAULT_STEPS=[
"Identify the client",
"Verify the client’s information",
"Verify their debts",
"Red pill: ask “are you aware…” about what they’re paying, the charges, and interest vs. lenders",
"Do the calculations before the red pill",
"Hold for 5 minutes for underwriting",
"Loan flip",
"If approved, go over the T-chart",
"Send the trust text",
"Enroll the client",
"Budget analysis",
"Hardship description",
"Banking: ask who they are currently banking with",
"Pitch coach, depending on the state, with the $299 package (if they don’t qualify, skip the file)",
"Send the file for approval",
"Send the DC for signature",
"Get a rep for compliance",
"Connect to the compliance call",
"Ask for a review or referral"
];
setSteps(DEFAULT_STEPS);
</script>
</body>
</html>
