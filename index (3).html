<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Assistant</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#18202b;--mu:#667085;--bd:#e2e7ef;--ac:#3b5bdb;--ac2:#edf1ff;--ok:#2f9e63;--warn:#e8590c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1319;--card:#181e27;--tx:#e9edf3;--mu:#9aa5b5;--bd:#273040;--ac:#7c96ff;--ac2:#202a4a;--ok:#4fd18b;--warn:#ff9150;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--bd)}
.brand{display:flex;gap:12px;align-items:center}.logo{font-size:26px}
.brand b{display:block;font-size:17px}.brand small{color:var(--mu)}
.status{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--bg);color:var(--mu);font-weight:600;font-size:13px}
.status i{width:9px;height:9px;border-radius:50%;background:var(--mu)}
.status.on{color:var(--ok)}.status.on i{background:var(--ok);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.prog{height:5px;background:var(--bd)}#pb{height:100%;width:0;background:var(--ok);transition:width .4s}
main{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;padding:18px 22px;max-width:1150px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
h2{margin:0 0 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.hero{background:var(--ac2);border-color:var(--ac)}
#lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
#big{font-size:26px;font-weight:700;line-height:1.25;margin:6px 0}
#sub{color:var(--mu);min-height:22px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
button{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.rec{background:#d9363e;border-color:#d9363e;color:#fff}
ol{list-style:none;margin:0;padding:0;max-height:380px;overflow-y:auto;position:relative}
li{display:flex;gap:12px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--bd);color:var(--mu)}
li:last-child{border:0}
li .n{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
li.done{color:var(--tx);opacity:.65}li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
li.cur{color:var(--tx);font-weight:700;background:var(--ac2);border-radius:10px}li.cur .n{border-color:var(--ac);color:var(--ac)}
#tr{height:360px;overflow-y:auto;white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px}
#tr .i{color:var(--mu)}
#msg{color:var(--warn);margin:10px 0 0;min-height:20px;font-size:13px}
#pop{position:fixed;top:12px;left:50%;transform:translate(-50%,-170%);width:min(680px,94vw);background:#1a2a6c;color:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 10px 34px rgba(0,0,0,.4);z-index:50;transition:transform .25s}
#pop.show{transform:translate(-50%,0)}#pop .pd{opacity:.8;font-size:13px}#pop .pn{font-size:21px;font-weight:700}
</style>
</head>
<body>
<div id="pop" role="status" aria-live="polite"></div>
<header class="top">
  <div class="brand"><span class="logo">🎧</span><div><b>Call Assistant</b><small>Follow the script, step by step</small></div></div>
  <div class="status" id="st"><i></i><span id="stt">Not listening</span></div>
</header>
<div class="prog"><div id="pb"></div></div>
<main>
  <div class="col">
    <section class="card hero">
      <div id="lbl"></div><div id="big"></div><div id="sub"></div>
      <div class="ctl"><button id="go" class="pri">Start listening</button><button id="pip">Pop out</button><button id="nw">New call</button></div>
    </section>
    <section class="card"><h2>Script</h2><ol id="steps"></ol></section>
  </div>
  <div class="col">
    <section class="card"><h2>Live transcript</h2><div id="tr"></div>
      <div class="ctl"><button id="dl">Save transcript</button></div><p id="msg"></p></section>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const STEPS=[
"Identify the client",
"Verify the client’s information",
"Verify their debts",
"Red pill: ask “are you aware…” about what they’re paying, the charges, and interest vs. lenders",
"Do the calculations before the red pill",
"Hold for 5 minutes for underwriting",
"Loan flip",
"If approved, go over the T-chart",
"Send the trust text",
"Enroll the client",
"Budget analysis",
"Hardship description",
"Banking: ask who they are currently banking with",
"Pitch coach, depending on the state, with the $299 package (if they don’t qualify, skip the file)",
"Send the file for approval",
"Send the DC for signature",
"Get a rep for compliance",
"Connect to the compliance call",
"Ask for a review or referral"];
const KEYS=[
/identif|speaking with|your name|full name|who am i/,
/verify|verif|date of birth|last four|address|confirm your|social/,
/debts?|creditor|credit card|balance|owe|accounts?/,
/are you aware|interest|charged|red pill/,
/calculat|total debt|total payments|crunch/,
/\bhold\b|underwrit|5 minutes|five minutes|one moment|bear with me/,
/loan|consolidat/,
/t[- ]?chart|program|months|monthly payment/,
/text|trust|link/,
/enroll|enrol|sign up|get started|move forward/,
/budget|income|expenses|rent|groceries/,
/hardship|reason|lost (my |your )?job|medical|struggl/,
/bank|checking|savings|banking with/,
/299|two ninety|pitch|package|fee/,
/approval|submit|send (the |your )?file/,
/sign|docusign|\bdc\b|document/,
/compliance|\brep\b/,
/compliance|on the line|connect/,
/review|referral|refer|trustpilot|feedback/];
let idx=0,tx="",interim="",since=0,block=false,on=false,rec=null,AC=null,pipW=null,popT;
const msg=t=>$("#msg").textContent=t||"";
function draw(){
  const ol=$("#steps");ol.innerHTML="";
  STEPS.forEach((s,i)=>{const li=document.createElement("li");li.className=i<idx?"done":i===idx?"cur":"";
    const n=document.createElement("span");n.className="n";n.textContent=i<idx?"✓":i+1;
    const t=document.createElement("span");t.textContent=s;li.append(n,t);ol.append(li)});
  const fin=idx>=STEPS.length;
  $("#lbl").textContent=fin?"Script complete":`Step ${idx+1} of ${STEPS.length}`;
  $("#big").textContent=fin?"All steps complete ✓":STEPS[idx];
  $("#sub").textContent=fin?"":(on?"Listening… I’ll move on when I hear you complete this step.":"Press Start listening to begin.");
  $("#pb").style.width=(idx/STEPS.length*100)+"%";
  const c=ol.querySelector(".cur");if(c)ol.scrollTop=Math.max(0,c.offsetTop-ol.clientHeight/3);
  pipDraw();
}
function drawT(){const el=$("#tr");el.textContent=tx;
  if(interim){const s=document.createElement("span");s.className="i";s.textContent=interim;el.append(s)}
  el.scrollTop=el.scrollHeight}
function ui(){const b=$("#go");b.textContent=on?"Stop listening":"Start listening";b.className=on?"rec":"pri";
  $("#st").className=on?"status on":"status";$("#stt").textContent=on?"Listening":"Not listening";draw()}
function beep(){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(AC.currentTime+.12)}catch(e){}}
function popUp(d,n){const p=$("#pop");p.innerHTML="";
  if(d!=null){const a=document.createElement("div");a.className="pd";a.textContent="✓ "+STEPS[d];p.append(a)}
  const b=document.createElement("div");b.className="pn";
  b.textContent=n<STEPS.length?"NEXT → "+STEPS[n]:"All steps complete ✓";
  p.append(b);p.className="show";clearTimeout(popT);popT=setTimeout(()=>p.className="",7000)}
function advance(){idx++;since=tx.length;block=true;draw();beep();popUp(idx-1,idx)}
function detect(){
  if(idx>=STEPS.length)return;
  const t=(tx.slice(since)+" "+(block?"":interim)).toLowerCase();
  if(t.trim()&&KEYS[idx].test(t))advance();
}
function pipDraw(){
  if(!pipW||pipW.closed)return;
  const a=pipW.document.getElementById("pc"),b=pipW.document.getElementById("pn");if(!a||!b)return;
  a.textContent=idx<STEPS.length?`Step ${idx+1} of ${STEPS.length}`:"";
  b.textContent=idx<STEPS.length?"NEXT → "+STEPS[idx]:"All steps complete ✓";
}
$("#pip").onclick=async()=>{
  if(!window.documentPictureInPicture){msg("Pop-out needs a recent Chrome or Edge.");return}
  try{pipW=await documentPictureInPicture.requestWindow({width:440,height:190});
    const st=pipW.document.createElement("style");
    st.textContent="body{margin:0;padding:14px;background:#1a2a6c;color:#fff;font:700 22px/1.3 system-ui,sans-serif}#pc{font:13px system-ui,sans-serif;opacity:.75;margin-bottom:6px}";
    pipW.document.head.append(st);pipW.document.body.innerHTML='<div id="pc"></div><div id="pn"></div>';pipDraw();
  }catch(e){msg("Couldn’t open the pop-out window.")}
};
$("#nw").onclick=()=>{if(!confirm("Start a new call? This resets the script and clears the transcript."))return;
  idx=0;tx="";interim="";since=0;block=false;drawT();draw();msg("")};
$("#dl").onclick=()=>{const u=URL.createObjectURL(new Blob([tx],{type:"text/plain"}));const l=document.createElement("a");
  l.href=u;l.download="call-transcript.txt";l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("#go").onclick=()=>{
  if(on){on=false;try{rec.stop()}catch(e){}ui();return}
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(!SR){msg("This browser can’t do live speech recognition. Please use Chrome or Edge.");return}
  msg("");rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang="en-US";
  rec.onresult=e=>{let p="",fin=false;
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];
      if(r.isFinal){tx+=r[0].transcript.trim()+"\n";fin=true}else p+=r[0].transcript}
    interim=p;drawT();if(fin)block=false;detect()};
  rec.onend=()=>{if(on){try{rec.start()}catch(e){}}};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){on=false;ui();msg("Microphone access is blocked. Allow it in your browser’s site settings and try again.")}};
  try{rec.start();on=true;ui();popUp(null,idx)}catch(e){msg("Couldn’t start the microphone.")}
};
draw();
</script>
</body>
</html>
